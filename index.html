<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        To-do list
    </title>
    <link rel="stylesheet" href="index.css">
</head>

<body onload="handleOnLoad()">
    <h1>To-Do List</h1>
    <div id="main-container">
          <div id="pending" class="column" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
            <div class="header">
                <h2>Pending</h2>
            </div>
        
        </div>
        <div id="ongoing" class="column" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
            <div class="header">
                <h2>ongoing</h2>
            </div>
        </div>
         <div id="completed" class="column" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
            <div class="header">
                <h2>completed</h2>
            </div>
        </div>
    </div>
    <section>
        <form action="" onsubmit="addNewTask(event)">
            <h2> Add task</h2>
            <label for="title">Title : </label>
            <input type="text" id="title" name="title">
            <label for="description">Description : </label>
            <textarea name="description" hieght="100px" width="100px">write a description here....</textarea>
            <button type="submit" value="Add">Add</button>
            <button type="reset" value="Clear">Clear</button>
        </form>
        <button onclick="removeAllTasks()">Clear All Tasks</button>
    </section>
    <script src="index.js"></script>
</body>

</html>
